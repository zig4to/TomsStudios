<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pr'Tomšu</title>
<meta name="description" content="Središče aplikacij Pr'Tomšu — dogodki, checkliste, računi." />
<meta name="theme-color" content="#0b1020" />

<!-- Namestitev kot aplikacija (PWA) -->
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pr'Tomšu" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Nastavi temo pred prvim izrisom (brez utripa).
  (function () {
    var t;
    try { t = localStorage.getItem("ptomsetu-theme"); } catch (e) {}
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" />
        </svg>
      </span>
      <h1>Pr'Tomšu</h1>
    </div>
  </header>

  <main>
    <nav class="grid" aria-label="Aplikacije">

      <a class="card" data-app="mascajt" style="--accent:#6366f1; --accent-2:#a855f7" href="https://zig4to.github.io/masCajt/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 13.5h3M7.5 17h6"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Dogodki</span>
          <span class="card-sub">Koledar in termini</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="pisi" style="--accent:#6366f1; --accent-2:#3b82f6" href="https://pisi-omega.vercel.app/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 6h4M2 10h4M2 14h4M2 18h4"/><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M16 2v20"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Piši</span>
          <span class="card-sub">Beležke in zapiski</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="checkliste" style="--accent:#10b981; --accent-2:#22d3ee" href="https://zig4to.github.io/Checkliste/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3.5h6A1.5 1.5 0 0 1 16.5 5v.5H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2h1.5V5A1.5 1.5 0 0 1 9 3.5Z"/>
            <path d="m8.5 12.5 2 2 4-4.5"/><path d="M8.5 18h7"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Checkliste</span>
          <span class="card-sub">Opravila po korakih</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="racuni" style="--accent:#f59e0b; --accent-2:#fb7185" href="https://zig4to.github.io/Racuni/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2.5h12v19l-2.5-1.6L13 21.5l-2.5-1.6L8 21.5l-2-1.6Z"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Računi</span>
          <span class="card-sub">Izdaja in pregled</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="komadi" style="--accent:#ec4899; --accent-2:#f97316" href="https://zig4to.github.io/Komadi/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Komadi</span>
          <span class="card-sub">Priljubljene skladbe</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="iskra" style="--accent:#f59e0b; --accent-2:#ef4444" href="https://zig4to.github.io/Iskra/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Iskra</span>
          <span class="card-sub">Ideje in izboljšave</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="zdrav" style="--accent:#22c55e; --accent-2:#16a34a" href="https://zig4to.github.io/Zdrav/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
            <circle cx="12" cy="9.8" r="4"/>
            <circle cx="12" cy="15.3" r="7"/>
            <path d="M12 5.8 L12 3.2" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M12 4.1 Q14.2 2.4 15.7 3 Q14.8 5.3 12 4.1 Z" stroke="none"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Zdrav</span>
          <span class="card-sub">Zdravi obroki</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="kam" style="--accent:#38bdf8; --accent-2:#0f766e" href="https://zig4to.github.io/Kam/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17.5 L9 8 L12 12 L15 6 L20 17.5 Z"/><path d="M8.16 9.6 L9 8 L10.2 9.6 M14.2 7.6 L15 6 L15.7 7.6"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Kam</span>
          <span class="card-sub">Naključna pohodna točka</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="posel" style="--accent:#93a2c6; --accent-2:#282c47" href="https://posel-six.vercel.app/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.6" y="8.4" width="16.8" height="11.6" rx="3.4"/><path d="M9.4 8.4V7a2.4 2.4 0 0 1 2.4-2.4h0.4a2.4 2.4 0 0 1 2.4 2.4v1.4"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Posel</span>
          <span class="card-sub">Stranke in koledar</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="card" data-app="viharnik" style="--accent:#6d5cf5; --accent-2:#facc15" href="https://viharnik.vercel.app/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/>
            <path d="M13 11 9 17h6l-4 6"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-title">Viharnik</span>
          <span class="card-sub">Gorska vremenska napoved</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <!-- Prosto mesto za prihodnje aplikacije: podvoji enega od zgornjih <a class="card"> blokov. -->

    </nav>
    <script>
      // Uveljavi shranjeni vrstni red kartic še pred izrisom (brez utripa).
      // Neznane / na novo dodane aplikacije ostanejo na koncu.
      (function () {
        try {
          var order = JSON.parse(localStorage.getItem("ptomsetu-card-order") || "[]");
          var grid = document.querySelector(".grid");
          if (!grid || !order.length) return;
          var rest = [].slice.call(grid.querySelectorAll(".card"));
          order.forEach(function (id) {
            for (var i = 0; i < rest.length; i++) {
              if (rest[i].getAttribute("data-app") === id) {
                grid.appendChild(rest.splice(i, 1)[0]);
                break;
              }
            }
          });
          rest.forEach(function (c) { grid.appendChild(c); });
        } catch (e) {}
      })();
    </script>
  </main>

  <footer class="site-footer">
    <div class="settings">
      <div class="settings-row">
        <button class="settings-btn" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsPanel">
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 8.87a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11A1.7 1.7 0 0 0 19.4 15Z"/>
          </svg>
          <span>Nastavitve</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <button class="reset-btn" id="hardResetAllBtn" type="button" title="Trdo osveži vse aplikacije (počisti predpomnilnike vseh)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
          </svg>
          <span>Osveži vse</span>
        </button>
      </div>

      <div class="settings-panel" id="settingsPanel" hidden>
        <button class="theme-toggle" id="themeToggle" type="button">
          <span class="theme-icons" aria-hidden="true">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </span>
          <span id="themeLabel">Temna tema</span>
        </button>

        <button class="theme-toggle reorder-btn" id="reorderBtn" type="button" aria-pressed="false">
          <span class="reorder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 9 2 12l3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M12 2v20M2 12h20"/>
            </svg>
          </span>
          <span id="reorderLabel">Uredi razpored</span>
        </button>

        <button class="install-btn" id="installBtn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/>
          </svg>
          <span>Namesti aplikacijo</span>
        </button>

        <p class="install-hint" id="installHint" hidden></p>
      </div>
    </div>

    <span class="copy">Pr'Tomšu &middot; <span id="year"></span></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
