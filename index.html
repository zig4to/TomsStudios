<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TomStudios</title>
<meta name="description" content="Središče aplikacij TomStudios — dogodki, checkliste, računi." />
<meta name="theme-color" content="#0b1020" />

<!-- Namestitev kot aplikacija (PWA) -->
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TomStudios" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Nastavi temo pred prvim izrisom (brez utripa).
  (function () {
    var t;
    try { t = localStorage.getItem("ptomsetu-theme"); } catch (e) {}
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Nalaganje: prikazano dokler auth.js ne ugotovi, ali je uporabnik prijavljen. -->
  <div id="loadingScreen" class="loading-screen">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" />
      </svg>
    </span>
  </div>

  <!-- Prijava / registracija -->
  <div id="authScreen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" />
          </svg>
        </span>
        <h1>TomStudios</h1>
      </div>

      <p id="authNotConfigured" class="auth-hint" hidden>
        Supabase še ni nastavljen — uredi <code>supabase-config.js</code> z Project URL in anon key iz Supabase nadzorne plošče.
      </p>

      <div id="authForms">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab" id="tabLogin" type="button" role="tab" aria-selected="true">Prijava</button>
          <button class="auth-tab" id="tabRegister" type="button" role="tab" aria-selected="false">Registracija</button>
        </div>

        <form id="loginForm" class="auth-form">
          <input type="email" required placeholder="E-pošta" autocomplete="email" />
          <input type="password" required placeholder="Geslo" autocomplete="current-password" />
          <p class="auth-error" hidden></p>
          <button type="submit" class="auth-submit">Prijava</button>
        </form>

        <form id="registerForm" class="auth-form" hidden>
          <input type="text" required placeholder="Ime" autocomplete="given-name" />
          <input type="text" required placeholder="Priimek" autocomplete="family-name" />
          <input type="email" required placeholder="E-pošta" autocomplete="email" />
          <input type="password" required minlength="6" placeholder="Geslo (najmanj 6 znakov)" autocomplete="new-password" />
          <p class="auth-error" hidden></p>
          <p class="auth-hint">Registracija je na voljo samo za povabljene e-poštne naslove.</p>
          <button type="submit" class="auth-submit">Ustvari račun</button>
        </form>
      </div>
    </div>
  </div>

  <div id="appShell" hidden>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M9.5 21v-6h5v6" />
          </svg>
        </span>
        <h1>TomStudios</h1>
      </div>

      <div class="user-avatar-wrap">
        <button class="user-avatar" id="userAvatarBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Kdo je prijavljen">
          <span id="userAvatarInitials">?</span>
        </button>
        <div class="user-avatar-popover" id="userAvatarPopover" hidden>
          <span class="user-avatar-popover-name" id="userAvatarName" hidden></span>
          <span class="user-avatar-popover-email" id="userAvatarEmail"></span>
          <div class="user-avatar-popover-menu">
            <button class="user-avatar-popover-item" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsPanel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 8.87a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11A1.7 1.7 0 0 0 19.4 15Z"/>
              </svg>
              <span>Nastavitve</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <div class="settings-panel" id="settingsPanel" hidden>
              <button class="user-avatar-popover-item" id="themeToggle" type="button">
                <span class="theme-icons" aria-hidden="true">
                  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                </span>
                <span id="themeLabel">Temna tema</span>
              </button>

              <button class="user-avatar-popover-item reorder-btn" id="reorderBtn" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 9 2 12l3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M12 2v20M2 12h20"/>
                </svg>
                <span id="reorderLabel">Uredi razpored</span>
              </button>

              <button class="user-avatar-popover-item" id="addSlotBtn" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>Dodaj mesto</span>
              </button>

              <button class="install-btn" id="installBtn" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/>
                </svg>
                <span>Namesti</span>
              </button>

              <p class="install-hint" id="installHint" hidden></p>
            </div>

            <button class="user-avatar-popover-item" id="hardResetAllBtn" type="button" title="Trdo osveži vse aplikacije (počisti predpomnilnike vseh)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
              </svg>
              <span>Osveži vse</span>
            </button>
            <button class="user-avatar-popover-item" id="avatarLogoutBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
              </svg>
              <span>Odjava</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <nav class="grid" id="appGrid" aria-label="Aplikacije"></nav>
    </main>

    <footer class="site-footer">
      <span class="copy">TomStudios &middot; <span id="year"></span></span>
    </footer>
  </div>

  <!-- Izbirnik aplikacij za prazno "+" mesto -->
  <div class="modal-overlay" id="appPickerModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="appPickerTitle">
      <div class="modal-header">
        <h2 id="appPickerTitle">Izberi aplikacijo</h2>
        <button class="modal-close" id="appPickerClose" type="button" aria-label="Zapri">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-apps-row" id="appPickerList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="apps-registry.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
