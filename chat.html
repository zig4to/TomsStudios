<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Klepet · Bitneverse</title>
<meta name="theme-color" content="#0b1020" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="chat.css" />
<link rel="stylesheet" href="games.css" />
<script>
  // Ista tema kot na plošči (app.js), nastavljena pred prvim izrisom.
  (function () {
    var t;
    try { t = localStorage.getItem("ptomsetu-theme"); } catch (e) {}
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body class="chat-page">
  <div class="chat-bg" aria-hidden="true">
    <span class="chat-blob chat-blob--1"></span>
    <span class="chat-blob chat-blob--2"></span>
  </div>

  <header class="chat-header">
    <a class="admin-back" href="./" aria-label="Nazaj na ploščo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Plošča</span>
    </a>
    <div class="chat-title">
      <h1>Klepet<span>.</span></h1>
      <div class="chat-online" id="chatOnline" hidden>
        <span class="chat-online-avs" id="chatOnlineAvs"></span>
        <span class="chat-online-txt" id="chatOnlineTxt"></span>
      </div>
    </div>
    <a class="igra-trophy" href="igra.html" aria-label="Igre in lestvica" title="Igre in lestvica">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </a>
  </header>

  <main class="chat-main">
    <p class="chat-gate" id="chatGate">Nalagam …</p>

    <div class="chat-scroll" id="chatScroll" hidden>
      <div class="chat-more" id="chatMore" hidden><span class="chat-spin"></span></div>
      <div class="chat-empty" id="chatEmpty" hidden>
        <strong>Tukaj je še tiho.</strong>
        <span>Napiši prvo sporočilo vsem v Bitneverse.</span>
      </div>
      <div class="chat-list" id="chatList" role="log" aria-live="polite" aria-label="Sporočila"></div>
    </div>

    <button class="chat-jump" id="chatJump" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      <span id="chatJumpTxt">Nova sporočila</span>
    </button>
  </main>

  <footer class="chat-foot" id="chatFoot" hidden>
    <div class="chat-typing" id="chatTyping" aria-live="polite"></div>
    <form class="chat-composer" id="chatForm" autocomplete="off">
      <button class="chat-icon-btn" id="chatAttach" type="button" aria-label="Priloži datoteko" title="Datoteka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <button class="chat-icon-btn" id="chatPhoto" type="button" aria-label="Slika iz galerije" title="Galerija">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
      </button>
      <button class="chat-icon-btn chat-game-btn" id="chatGame" type="button" aria-label="Izzovi na igro" title="Igra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>
      </button>
      <textarea class="chat-input" id="chatInput" rows="1" maxlength="4000" placeholder="Sporočilo …" aria-label="Sporočilo" enterkeyhint="send"></textarea>
      <button class="chat-send" id="chatSend" type="submit" aria-label="Pošlji" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
      </button>
      <input type="file" id="chatFile" hidden />
      <input type="file" id="chatGallery" accept="image/*,video/*" hidden />
    </form>
  </footer>

  <!-- meni sporočila: odzivi + brisanje -->
  <div class="chat-menu" id="chatMenu" role="menu" hidden>
    <div class="chat-menu-emojis" id="chatMenuEmojis"></div>
    <button class="chat-menu-del" id="chatMenuDel" type="button" role="menuitem" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>Izbriši</span>
    </button>
  </div>
  <div class="chat-menu-veil" id="chatMenuVeil" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="seri-common.js"></script>
  <script src="games.js"></script>
  <script src="chat.js"></script>
</body>
</html>
