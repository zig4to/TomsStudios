<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Šeri · TomStudios</title>
<meta name="theme-color" content="#0b1020" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="seri.css" />
<script>
  // Ista tema kot na plošči (app.js), nastavljena pred prvim izrisom.
  (function () {
    var t;
    try { t = localStorage.getItem("ptomsetu-theme"); } catch (e) {}
    if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body class="seri-page">

  <header class="seri-header">
    <a class="admin-back" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Plošča</span>
    </a>
    <h1 class="seri-logo"><span class="seri-logo-txt">Šeri</span><span class="seri-logo-dot">.</span></h1>
  </header>

  <main class="seri-main">
    <p class="seri-gate" id="seriGate">Nalagam …</p>

    <div class="seri-app" id="seriApp" hidden>
      <!-- Prejemniki -->
      <label class="seri-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="seriSearch" placeholder="Poišči osebo …" autocomplete="off" enterkeyhint="search" aria-label="Poišči osebo" />
      </label>
      <p class="seri-search-empty" id="seriSearchEmpty" hidden>Ni zadetkov.</p>

      <section class="seri-people" aria-label="Komu pošlješ">
        <div class="seri-people-track" id="seriPeople" role="listbox" aria-label="Uporabniki"></div>
      </section>

      <!-- Oder: velik plus ali kartica datoteke -->
      <section class="seri-stage" id="seriStage">
        <p class="seri-to" id="seriTo" hidden></p>

        <button class="seri-plus" id="seriPlus" type="button" aria-label="Izberi datoteko">
          <span class="seri-plus-ring" aria-hidden="true"></span>
          <span class="seri-plus-core" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </button>
        <p class="seri-plus-hint" id="seriPlusHint">Tapni in izberi datoteko <span>· do 50 MB · vsi formati</span></p>
        <button class="seri-gallery" id="seriGallery" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
          <span>Galerija</span>
        </button>

        <div class="seri-file" id="seriFile" hidden>
          <div class="seri-file-card" id="seriFileCard">
            <div class="seri-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="seri-doc" id="seriDoc">
              <svg class="seri-doc-svg" viewBox="0 0 120 150" aria-hidden="true">
                <defs>
                  <clipPath id="seriDocClip"><path d="M14 4h66l36 36v96a10 10 0 0 1-10 10H14A10 10 0 0 1 4 136V14A10 10 0 0 1 14 4Z"/></clipPath>
                  <linearGradient id="seriDocGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="var(--doc-a)"/><stop offset="1" stop-color="var(--doc-b)"/>
                  </linearGradient>
                </defs>
                <g clip-path="url(#seriDocClip)">
                  <rect width="120" height="150" fill="var(--doc-paper)"/>
                  <!-- tekočina, ki se dviga med nalaganjem -->
                  <g class="seri-liquid" id="seriLiquid">
                    <path class="seri-wave seri-wave--back" d="M0 10 Q 15 0 30 10 T 60 10 T 90 10 T 120 10 T 150 10 T 180 10 T 210 10 T 240 10 V 200 H 0 Z" fill="url(#seriDocGrad)" opacity=".45"/>
                    <path class="seri-wave seri-wave--front" d="M0 10 Q 15 20 30 10 T 60 10 T 90 10 T 120 10 T 150 10 T 180 10 T 210 10 T 240 10 V 200 H 0 Z" fill="url(#seriDocGrad)"/>
                  </g>
                  <path d="M80 4v26a10 10 0 0 0 10 10h26" fill="var(--doc-fold)"/>
                </g>
                <path d="M14 4h66l36 36v96a10 10 0 0 1-10 10H14A10 10 0 0 1 4 136V14A10 10 0 0 1 14 4Z" fill="none" stroke="var(--doc-edge)" stroke-width="2"/>
              </svg>
              <span class="seri-doc-ext" id="seriDocExt">FILE</span>
            </div>
            <div class="seri-file-name" id="seriFileName"></div>
            <div class="seri-file-meta" id="seriFileMeta"></div>
            <div class="seri-progress" id="seriProgress" hidden>
              <div class="seri-progress-bar"><span id="seriProgressFill"></span></div>
              <span class="seri-progress-pct" id="seriProgressPct">0 %</span>
            </div>
          </div>
          <div class="seri-swipe-hint" id="seriSwipeHint" aria-hidden="true">
            <span class="seri-chev"></span><span class="seri-chev"></span><span class="seri-chev"></span>
            <em>Povleci gor in pošlji</em>
          </div>
          <div class="seri-file-actions">
            <button class="seri-btn seri-btn--ghost" id="seriCancel" type="button">Prekliči</button>
            <button class="seri-btn seri-btn--go" id="seriSend" type="button">Pošlji</button>
          </div>
        </div>

        <input type="file" id="seriInput" hidden />
        <input type="file" id="seriGalleryInput" accept="image/*,video/*" hidden />
      </section>

      <div class="seri-drop" id="seriDrop" hidden><span>Spusti datoteko</span></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="seri-common.js"></script>
  <script src="seri.js"></script>
</body>
</html>
